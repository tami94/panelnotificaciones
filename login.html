<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D1321">
<title>Ingresar · Notificaciones RPA</title>
<style>
  :root{--bg:#0D1321; --surface:#161D2E; --border:#242E45; --text:#E7ECF6; --muted:#8B96AD; --accion:#6FA8FF; --error:#FF6161}
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       min-height:100dvh; display:grid; place-items:center; padding:20px}
  form{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px 24px; width:100%; max-width:340px}
  h1{font-size:18px; font-weight:700; letter-spacing:-.01em}
  p{color:var(--muted); font-size:13px; margin-top:4px}
  input{width:100%; margin-top:18px; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
        background:var(--bg); color:var(--text); font:inherit}
  button{width:100%; margin-top:12px; padding:11px; border-radius:10px; border:none;
         background:var(--accion); color:#0D1321; font-weight:700; font-size:15px; cursor:pointer}
  .error{color:var(--error); font-size:13px; margin-top:12px}
  :focus-visible{outline:2px solid var(--accion); outline-offset:2px}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Notificaciones RPA</h1>
  <p>Panel de seguimiento de automatizaciones</p>
  <input type="password" name="password" placeholder="Contraseña" required autofocus autocomplete="current-password">
  <button type="submit">Ingresar</button>
  <div class="error" id="err" hidden>Contraseña incorrecta.</div>
</form>
<script>
  if (new URLSearchParams(location.search).get("error")) document.getElementById("err").hidden = false;
</script>
</body>
</html>
